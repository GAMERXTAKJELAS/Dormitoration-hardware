[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -D CORE_DEBUG_LEVEL=3
lib_deps = 
    bblanchon/ArduinoJson@^7
    adafruit/Adafruit GFX Library@^1.11.11
    adafruit/Adafruit SSD1306@^2.5.13